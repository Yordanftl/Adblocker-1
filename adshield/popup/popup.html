<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdShield</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header>
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#818cf8" />
            <stop offset="1" stop-color="#4f46e5" />
          </linearGradient>
        </defs>
        <path d="M12 1.5l8.5 3.2v6.1c0 5.3-3.6 10-8.5 11.7-4.9-1.7-8.5-6.4-8.5-11.7V4.7L12 1.5z" fill="url(#shieldGrad)" />
        <path d="M8.2 12.1l2.6 2.6 5-5.2" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="title">
        <h1>AdShield</h1>
        <p id="statusText">Protection on</p>
      </div>
      <label class="switch" title="Toggle protection">
        <input type="checkbox" id="toggle" checked />
        <span class="slider"></span>
      </label>
    </header>

    <section class="stats">
      <div class="stat">
        <span class="num" id="pageCount">0</span>
        <span class="label">Blocked on this page</span>
      </div>
      <div class="stat">
        <span class="num" id="totalCount">0</span>
        <span class="label">Total blocked</span>
      </div>
    </section>

    <section class="site" id="siteSection">
      <p class="site-host" id="hostname">example.com</p>
      <button id="siteBtn" class="btn">Pause on this site</button>
    </section>

    <footer>
      <a href="#" id="optionsLink">Settings &amp; filters</a>
      <span class="version">v1.0.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
